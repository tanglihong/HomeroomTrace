name: Deploy to CloudBase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
      TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
      TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
      NEXT_PUBLIC_AUTH_API_BASE: ${{ secrets.NEXT_PUBLIC_AUTH_API_BASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Validate secrets
        run: |
          if [ -z "$TCB_SECRET_ID" ]; then
            echo "::error::Missing GitHub Secret: TCB_SECRET_ID (腾讯云 SecretId，通常以 AKID 开头)"
            exit 1
          fi
          if [ -z "$TCB_SECRET_KEY" ]; then
            echo "::error::Missing GitHub Secret: TCB_SECRET_KEY (腾讯云 SecretKey)"
            exit 1
          fi
          if [ -z "$TCB_ENV_ID" ]; then
            echo "::error::Missing GitHub Secret: TCB_ENV_ID (CloudBase 环境 ID)"
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_AUTH_API_BASE" ]; then
            echo "::error::Missing GitHub Secret: NEXT_PUBLIC_AUTH_API_BASE (云函数 HTTP 根 URL)"
            exit 1
          fi
          case "$TCB_SECRET_ID" in
            AKID*) echo "SecretId format looks valid" ;;
            *) echo "::warning::TCB_SECRET_ID 通常以 AKID 开头，请确认复制的是 SecretId 而不是 SecretKey 或环境 ID" ;;
          esac

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: test -f out/index.html

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli@2.12.10

      - name: Login CloudBase
        run: tcb login --key --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"

      - name: Deploy static site
        run: tcb hosting deploy ./out / -e "$TCB_ENV_ID"
