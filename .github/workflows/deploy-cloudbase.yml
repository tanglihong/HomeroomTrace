name: Deploy to CloudBase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TENCENTCLOUD_SECRETID: ${{ secrets.TCB_SECRET_ID }}
      TENCENTCLOUD_SECRETKEY: ${{ secrets.TCB_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_AUTH_API_BASE: ${{ secrets.NEXT_PUBLIC_AUTH_API_BASE }}
          NEXT_PUBLIC_TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: npm run build

      - name: Verify build output
        run: test -f out/index.html

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli@2.7.9

      - name: Login CloudBase
        run: tcb login --apiKeyId "${{ secrets.TCB_SECRET_ID }}" --apiKey "${{ secrets.TCB_SECRET_KEY }}"

      - name: Ensure static hosting is enabled
        run: tcb hosting detail --envId "${{ secrets.TCB_ENV_ID }}" --yes
        continue-on-error: true

      - name: Deploy static site
        run: tcb hosting deploy ./out / --envId "${{ secrets.TCB_ENV_ID }}" --yes --verbose
